<!DOCTYPE html>
<html lang="bn">
<head>

<meta name="66c425fa8287715414a2250e31b4c16d9d21f0f9" content="66c425fa8287715414a2250e31b4c16d9d21f0f9" />

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      color: #fff;
      padding: 20px;
    }
    .card {
      text-align: center;
      padding: 40px 28px;
      background: #1e293b;
      border-radius: 16px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 24px; color: #94a3b8; line-height: 1.6; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }
    a.btn:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div class="card">
    <h1>স্বাগতম 👋</h1>
    <p>এই পেজে আপনার কনটেন্ট থাকবে।<br>Back চাপলে অটোমেটিক লিংকে চলে যাবে।</p>
    <a class="btn" href="https://adsgram.ai/" target="_blank" rel="noopener">এখনই দেখুন</a>
  </div>

  <script>
    (function () {
      var TARGET = 'https://adsgram.ai/';

      // ১. বর্তমান অবস্থাকে history-তে গার্ড হিসেবে রেখে দিচ্ছি
      //    যাতে back চাপলে popstate ট্রিগার হয়
      history.pushState({ guard: true }, '', location.href);

      // ২. back চাপলে (popstate) → সরাসরি টার্গেট লিংকে
      window.addEventListener('popstate', function () {
        // আবার গার্ড বসিয়ে দিচ্ছি, যাতে বারবার back চাপলেও আটকায়
        history.pushState({ guard: true }, '', location.href);
        window.location.replace(TARGET);
      });

      // ৩. অ্যান্ড্রয়েড হার্ডওয়্যার back বাটন হ্যান্ডেল (কিছু ওয়েবভিউ/ব্রাউজারে)
      window.addEventListener('pageshow', function (e) {
        if (e.persisted) {
          history.pushState({ guard: true }, '', location.href);
        }
      });
    })();
  </script>
</body>
</html>
